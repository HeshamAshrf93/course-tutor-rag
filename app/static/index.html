<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدرس المنهج</title>
<style>:root{color-scheme:light dark}body{font:16px/1.7 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px 16px}textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #8886}button{margin-top:8px;cursor:pointer}.row{display:flex;gap:8px}.card{border:1px solid #8886;border-radius:10px;padding:14px;margin-top:16px;white-space:pre-wrap}.src{opacity:.75;font-size:14px;margin-top:8px}</style></head>
<body><h1>مدرس المنهج</h1><p>اسأل عن المادة، وهتاخد إجابة من المنهج بالصفحة.</p><textarea id="q" rows="3" maxlength="500" placeholder="مثال: ايه الفرق بين الستاك والكيو؟"></textarea><div class="row"><button id="ask">اسأل</button><button id="quiz">اختبرني</button></div><div id="out"></div>
<script>const $=i=>document.getElementById(i),out=$('out');
function card(t,src){const c=document.createElement('div');c.className='card';c.textContent=t;if(src){const s=document.createElement('div');s.className='src';s.textContent=src;c.append(s)}out.replaceChildren(c)}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error();return r.json()}
$('ask').onclick=async()=>{const q=$('q').value.trim();if(!q)return;try{const a=await post('/ask',{question:q});card(a.answer,a.citations.map(c=>`المصدر: ${c.source}، صفحة ${c.page}`).join(' · '))}catch{card('حصلت مشكلة، جرب تاني.')}};
$('quiz').onclick=async()=>{const q=$('q').value.trim();if(!q)return;try{const d=await post('/quiz',{topic:q});card(d.questions.length?d.questions.map((x,i)=>`${i+1}. ${x.question}\n${x.options.join(' / ')}\n(صفحة ${x.page})`).join('\n\n'):d.message)}catch{card('حصلت مشكلة، جرب تاني.')}};</script></body></html>
